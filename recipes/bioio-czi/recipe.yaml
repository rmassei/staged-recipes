schema_version: 1

context:
  name: bioio-czi
  version: "3.0.1"
  python_min: "3.9"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  # use the real PyPI location or the GitHub archive
  url: https://files.pythonhosted.org/packages/source/b/i/bioio_czi/bioio_czi-${{ version }}.tar.gz
  sha256: 1b11f23529fe46fd6a0777ff535227c9a5f402cd58cf8ccd314007b62d83d5ac

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=${{ python_min }},<3.14
    - setuptools >=65
    - setuptools-scm >=6.2
    - pip
  run:
    - python >=${{ python_min }},<3.14
    - aicspylibczi >=3.2.1
    - bioio-base >=0.2.0
    - dask-core >=2021.4.1
    - numpy >=1.24
    - fsspec >=2022.8.0
    - lxml >=4.6,<5
    - ome-types >=0.3.4
    - xarray >=0.16.1

tests:
  - python:
      imports:
        - bioio_czi
        - bioio_czi.aicspylibczi_reader.reader
        - bioio_czi.pylibczirw_reader.reader
      pip_check: true
      python_version: ">=3.9,<3.14"
  - script:
      - python -c "from importlib.metadata import entry_points as e; assert 'bioio-czi' in [x.name for x in e(group='bioio.readers')]"
      - python -c "from bioio_czi import Reader"
    requirements:
      run:
        - python >=${{ python_min }},<3.14

about:
  summary: A BioIO reader plugin for reading Zeiss CZI files.
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/bioio-devs/bioio-czi
  repository: https://github.com/bioio-devs/bioio-czi
  documentation: https://bioio-devs.github.io/bioio-czi

extra:
  recipe-maintainers:
    - rmassei
